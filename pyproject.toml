[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odds-engine"
version = "3.1.0"
description = "Football odds research and paper-trading engine"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "requests>=2.31",
  "streamlit>=1.35",
  "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["odds_engine*"]
